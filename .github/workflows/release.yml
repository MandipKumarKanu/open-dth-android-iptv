name: Build and Release Android APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build 32-bit ARM APK
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          flutter build apk --release \
            --target-platform android-arm \
            --android-skip-build-dependency-validation \
            --build-name="$VERSION" \
            --build-number="${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk open-dth-android-iptv-armeabi-v7a.apk

      - name: Build 64-bit ARM APK
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          flutter build apk --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation \
            --build-name="$VERSION" \
            --build-number="${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk open-dth-android-iptv-arm64-v8a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Open DTH Android IPTV ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            open-dth-android-iptv-armeabi-v7a.apk
            open-dth-android-iptv-arm64-v8a.apk
